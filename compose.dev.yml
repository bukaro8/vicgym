services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vicgym
      POSTGRES_USER: vicgym
      POSTGRES_PASSWORD: vicgym-local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicgym -d vicgym"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vicgym-postgres:/var/lib/postgresql/data

volumes:
  vicgym-postgres:
